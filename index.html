<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 생성물 판별 분석기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <h1>🔍 AI 생성물 판별 분석기</h1>
            <p class="subtitle">Google Gemini API 기반 이미지/영상 분석</p>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="main-content">
            <!-- 1단계: 파일 업로드 -->
            <section class="upload-section" id="uploadSection">
                <h2>이미지 또는 영상 선택</h2>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📤</div>
                    <p>여기에 파일을 드래그하거나 클릭하여 선택</p>
                    <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
                    <button class="btn btn-primary" id="uploadBtn">파일 선택</button>
                </div>
            </section>

            <!-- 2단계: 프리뷰 -->
            <section class="preview-section" id="previewSection" style="display: none;">
                <h2>미디어 미리보기</h2>
                <div class="preview-container">
                    <img id="imagePreview" style="display: none; max-width: 100%; max-height: 400px;">
                    <video id="videoPreview" style="display: none; max-width: 100%; max-height: 400px;" controls></video>
                </div>
                <div class="button-group">
                    <button class="btn btn-secondary" id="changeFileBtn">다른 파일 선택</button>
                    <button class="btn btn-primary" id="analyzeBtn">분석 시작</button>
                </div>
            </section>

            <!-- 3단계: 분석 결과 -->
            <section class="results-section" id="resultsSection" style="display: none;">
                <h2>분석 결과</h2>

                <!-- 로딩 상태 -->
                <div class="loading" id="loadingState" style="display: none;">
                    <div class="spinner"></div>
                    <p>Gemini API로 분석 중입니다...</p>
                </div>

                <!-- 결과 -->
                <div class="results-content" id="resultsContent" style="display: none;">
                    <!-- AI 생성 가능성 -->
                    <div class="card">
                        <h3>🤖 AI 생성 가능성</h3>
                        <div class="confidence-bar">
                            <div class="confidence-fill" id="confidenceFill"></div>
                        </div>
                        <div class="confidence-info">
                            <span id="confidenceValue">0%</span>
                            <span id="confidenceLabel"></span>
                        </div>
                    </div>

                    <!-- 판정 -->
                    <div class="card verdict" id="verdictCard">
                        <h3>⚖️ 최종 판정</h3>
                        <p id="verdictText"></p>
                    </div>

                    <!-- 의심 신호 -->
                    <div class="card">
                        <h3>🚨 감지된 신호</h3>
                        <div id="signalsList"></div>
                    </div>

                    <!-- 상세 분석 -->
                    <div class="card">
                        <h3>📊 상세 분석</h3>
                        <div class="analysis-details">
                            <div class="detail-item">
                                <strong>질감:</strong>
                                <p id="textureAnalysis"></p>
                            </div>
                            <div class="detail-item">
                                <strong>조명:</strong>
                                <p id="lightingAnalysis"></p>
                            </div>
                            <div class="detail-item">
                                <strong>세부사항:</strong>
                                <p id="detailAnalysis"></p>
                            </div>
                            <div class="detail-item">
                                <strong>배경:</strong>
                                <p id="backgroundAnalysis"></p>
                            </div>
                        </div>
                    </div>

                    <!-- 요약 -->
                    <div class="card summary-card">
                        <h3>📝 종합 판정</h3>
                        <div id="summaryText" style="white-space: pre-wrap; line-height: 1.8; font-size: 0.95rem;"></div>
                    </div>
                </div>

                <!-- 에러 -->
                <div class="error" id="errorState" style="display: none;">
                    <p id="errorMessage"></p>
                    <button class="btn btn-secondary" id="retryBtn">다시 시도</button>
                </div>
            </section>
        </main>

        <!-- 푸터 -->
        <footer class="footer">
            <p>⚠️ <strong>주의:</strong> 이 분석은 보조 판단이며, 100% 정확하지 않을 수 있습니다.</p>
            <p>최종 판정은 전문가의 검토가 필요합니다.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
