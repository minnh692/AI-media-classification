<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AI 사진 분류기</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>AI 사진 분류기</h1>
    <p>
      사진을 업로드하면 AI가 만든 이미지일 가능성을 추정해 줍니다.<br>
      <strong>(※ 참고용 도구이며, 100% 정확하지 않습니다.)</strong>
    </p>

    <div class="upload-box">
      <input type="file" id="imageInput" accept="image/*">
      <button id="checkBtn">AI 판별하기</button>
    </div>

    <div id="preview"></div>

    <div id="result" class="hidden">
      <h2>결과</h2>
      <p id="label"></p>
      <p id="confidence"></p>
      <p id="reasons"></p>
    </div>

    <div id="error" class="error hidden"></div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const checkBtn = document.getElementById('checkBtn');
    const preview = document.getElementById('preview');
    const resultBox = document.getElementById('result');
    const errorBox = document.getElementById('error');
    const labelEl = document.getElementById('label');
    const confidenceEl = document.getElementById('confidence');
    const reasonsEl = document.getElementById('reasons');

    // 이미지 선택 시 미리보기
    imageInput.addEventListener('change', () => {
      preview.innerHTML = '';
      const file = imageInput.files[0];
      if (!file) return;

      const img = document.createElement('img');
      img.className = 'preview-img';
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    });

    // 버튼 클릭 시 서버로 이미지 전송
    checkBtn.addEventListener('click', async () => {
      errorBox.classList.add('hidden');
      resultBox.classList.add('hidden');

      const file = imageInput.files[0];
      if (!file) {
        showError('먼저 이미지를 선택해 주세요.');
        return;
      }

      const formData = new FormData();
      formData.append('image', file);

      checkBtn.disabled = true;
      checkBtn.textContent = '분석 중...';

      try {
        const res = await fetch('/api/check', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || '알 수 없는 오류가 발생했습니다.');
        } else {
          labelEl.textContent = data.label || '결과 문구가 없습니다.';
          confidenceEl.textContent = '신뢰도: ' + (data.confidence ?? '?') + '%';
          reasonsEl.textContent = data.reasons || '';
          resultBox.classList.remove('hidden');
        }
      } catch (err) {
        console.error(err);
        showError('네트워크 또는 서버 오류가 발생했습니다.');
      } finally {
        checkBtn.disabled = false;
        checkBtn.textContent = 'AI 판별하기';
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }
  </script>
</body>
</html>
